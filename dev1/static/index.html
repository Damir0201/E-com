<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интернет-Магазин</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Навигация -->
    <nav class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-2xl font-bold cursor-pointer flex items-center gap-2" onclick="showSection('catalog')">
                <i data-lucide="shopping-bag"></i> E-Shop
            </h1>

            <div class="flex items-center space-x-6">
                <button onclick="showSection('catalog')" class="hover:text-indigo-200 transition font-medium">Каталог</button>

                <!-- Меню авторизованного пользователя -->
                <div id="userMenu" class="hidden flex items-center space-x-4">
                    <button onclick="showSection('cart')" class="hover:text-indigo-200 transition relative">
                        <i data-lucide="shopping-cart"></i>
                        <span id="cartBadge" class="hidden absolute -top-2 -right-2 bg-red-500 text-white text-xs px-1.5 py-0.5 rounded-full">0</span>
                    </button>
                    <button onclick="showSection('orders')" class="hover:text-indigo-200 transition font-medium">Мои заказы</button>
                    <button id="adminBtn" onclick="showSection('admin')" class="hidden bg-yellow-500 hover:bg-yellow-600 px-3 py-1 rounded text-sm font-semibold transition">Админка</button>
                    <button onclick="logout()" class="hover:text-indigo-200 transition text-sm">Выйти</button>
                </div>

                <!-- Меню гостя -->
                <div id="guestMenu" class="flex space-x-3">
                    <button onclick="openModal('loginModal')" class="bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded transition text-sm">Войти</button>
                    <button onclick="openModal('registerModal')" class="bg-white text-indigo-600 hover:bg-indigo-50 px-3 py-1.5 rounded transition text-sm font-semibold">Регистрация</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Уведомления (Toasts) -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

    <!-- Основной контент -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">

        <!-- СЕКЦИЯ: КАТАЛОГ -->
        <section id="catalogSection">
            <!-- Поиск и категории -->
            <div class="flex flex-col md:flex-row gap-4 mb-6 justify-between items-center">
                <div class="flex gap-2 overflow-x-auto w-full md:w-auto pb-2" id="categoryFilters">
                    <button onclick="filterCategory(null)" class="cat-filter-btn bg-indigo-600 text-white px-4 py-2 rounded-full text-sm font-medium">Все</button>
                </div>
                <div class="relative w-full md:w-72">
                    <input type="text" id="searchInput" placeholder="Поиск товаров..." oninput="handleSearch()" class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <i data-lucide="search" class="absolute left-3 top-2.5 w-5 h-5 text-gray-400"></i>
                </div>
            </div>

            <!-- Сетка товаров -->
            <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
        </section>

        <!-- СЕКЦИЯ: КОРЗИНА -->
        <section id="cartSection" class="hidden">
            <h2 class="text-2xl font-bold mb-4">Ваша корзина</h2>
            <div id="cartContent" class="bg-white p-6 rounded-lg shadow-sm">
                <!-- Карточки товаров корзины будут тут -->
            </div>
        </section>

        <!-- СЕКЦИЯ: ЗАКАЗЫ -->
        <section id="ordersSection" class="hidden">
            <h2 class="text-2xl font-bold mb-4">История заказов</h2>
            <div id="ordersList" class="space-y-4"></div>
        </section>

        <!-- СЕКЦИЯ: АДМИН-ПАНЕЛЬ -->
        <section id="adminSection" class="hidden space-y-8">
            <h2 class="text-2xl font-bold border-b pb-2">Панель Администратора</h2>

            <!-- Добавление категории -->
            <div class="bg-white p-6 rounded-lg shadow-sm max-w-md">
                <h3 class="text-lg font-semibold mb-3">Создать категорию</h3>
                <form id="createCategoryForm" onsubmit="handleCreateCategory(event)" class="space-y-3">
                    <input type="text" id="catName" placeholder="Название категории" required class="w-full border px-3 py-2 rounded focus:ring-2 focus:ring-indigo-500 outline-none">
                    <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700 transition">Добавить</button>
                </form>
            </div>

            <!-- Добавление товара -->
            <div class="bg-white p-6 rounded-lg shadow-sm max-w-xl">
                <h3 class="text-lg font-semibold mb-3">Добавить новый товар</h3>
                <form id="createProductForm" onsubmit="handleCreateProduct(event)" class="space-y-3">
                    <input type="text" id="prodTitle" placeholder="Название товара" required class="w-full border px-3 py-2 rounded">
                    <textarea id="prodDesc" placeholder="Описание товара" class="w-full border px-3 py-2 rounded"></textarea>
                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" step="0.01" id="prodPrice" placeholder="Цена" required class="border px-3 py-2 rounded">
                        <input type="number" id="prodStock" placeholder="Количество на складе" required class="border px-3 py-2 rounded">
                    </div>
                    <input type="url" id="prodImage" placeholder="URL картинки (https://...)" class="w-full border px-3 py-2 rounded">
                    <select id="prodCategory" required class="w-full border px-3 py-2 rounded">
                        <option value="">Выберите категорию</option>
                    </select>
                    <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700 transition">Создать товар</button>
                </form>
            </div>
        </section>

    </main>

    <!-- МОДАЛЬНОЕ ОКНО: ВХОД -->
    <div id="loginModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg w-full max-w-md relative">
            <button onclick="closeModal('loginModal')" class="absolute top-3 right-3 text-gray-500 hover:text-black">&times;</button>
            <h3 class="text-xl font-bold mb-4">Вход в аккаунт</h3>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <input type="text" id="loginEmail" placeholder="Email или Username" required class="w-full border px-3 py-2 rounded">
                <input type="password" id="loginPassword" placeholder="Пароль" required class="w-full border px-3 py-2 rounded">
                <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700">Войти</button>
            </form>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО: РЕГИСТРАЦИЯ -->
    <div id="registerModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg w-full max-w-md relative">
            <button onclick="closeModal('registerModal')" class="absolute top-3 right-3 text-gray-500 hover:text-black">&times;</button>
            <h3 class="text-xl font-bold mb-4">Регистрация</h3>
            <form onsubmit="handleRegister(event)" class="space-y-4">
                <input type="text" id="regUsername" placeholder="Имя пользователя" required class="w-full border px-3 py-2 rounded">
                <input type="email" id="regEmail" placeholder="Email" required class="w-full border px-3 py-2 rounded">
                <input type="password" id="regPassword" placeholder="Пароль" required class="w-full border px-3 py-2 rounded">
                <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700">Зарегистрироваться</button>
            </form>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
